<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Liguilla MX</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#0f172a;color:white;padding:15px}
h1{color:#ffd700}
.card{background:white;color:#111;border-radius:20px;padding:20px;max-width:420px;margin:auto}
#flecha{font-size:42px;margin-bottom:2px}
#wrap{width:300px;height:300px;margin:10px auto;position:relative}
#ruleta{width:100%;height:100%;border-radius:50%;border:6px solid #111;position:relative;overflow:hidden;transition:transform 6s cubic-bezier(0.12,0.8,0.12,1);background:conic-gradient(#dc2626 0 45deg,#2563eb 45deg 90deg,#16a34a 90deg 135deg,#eab308 135deg 180deg,#9333ea 180deg 225deg,#ea580c 225deg 270deg,#0891b2 270deg 315deg,#db2777 315deg 360deg)}
.etiqueta{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:18px;font-weight:bold;color:white;font-size:13px;pointer-events:none}
button{background:#dc2626;color:white;border:none;padding:15px 30px;font-size:19px;border-radius:12px}
#resultado{font-size:28px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<h1>🏆 RULETA LIGUILLA MX</h1>
<p>8 equipos - 8 personas - 1 oportunidad</p>
<div class="card">
<h2 id="saludo">Hola</h2>
<div id="flecha">⬇️</div>
<div id="wrap"><div id="ruleta"></div></div>
<p>Presiona GIRAR y espera a que pare</p>
<button id="btn" onclick="girar()">🎡 GIRAR</button>
<div id="resultado"></div>
<p id="mensaje"></p>
</div>
<script>
const equipos=["Toluca","América","Cruz Azul","Atlas","Monterrey","Chivas","Pachuca","León"];
const asignacion={1:6,2:0,3:7,4:2,5:5,6:1,7:4,8:3};
const params=new URLSearchParams(window.location.search);
const jugador=params.get('jugador')||"1";
document.getElementById('saludo').innerText="Hola, Jugador "+jugador;
const ruleta=document.getElementById('ruleta');
equipos.forEach((e,i)=>{
let d=document.createElement('div');
d.className='etiqueta';
d.style.transform=`rotate(${i*45+22.5}deg)`;
d.innerText=e;
ruleta.appendChild(d);
});
let yaGiro=false;
function girar(){
if(yaGiro) return;
yaGiro=true;
document.getElementById('btn').innerText="Girando...";
let idx=asignacion[jugador]||0;
let centro=idx*45+22.5;
let total=360*10 + (360 - centro);
ruleta.style.transform=`rotate(${total}deg)`;
setTimeout(()=>{
document.getElementById('resultado').innerText="🎉 ¡Tu equipo es: "+equipos[idx]+"!";
document.getElementById('mensaje').innerText="Este es tu equipo para la Liguilla. ¡Suerte, a ver quién es campeón!";
document.getElementById('btn').innerText="Ya giraste";
},6100);
}
</script>
</body>
</html>
