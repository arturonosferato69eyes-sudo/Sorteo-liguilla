<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Liguilla MX</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#0f172a;color:white;padding:15px}
h1{color:#ffd700}
.card{background:white;color:#111;border-radius:20px;padding:20px;max-width:420px;margin:auto}
#ruleta{width:300px;height:300px;border-radius:50%;margin:20px auto;border:6px solid #111;position:relative;transition:transform 6s cubic-bezier(0.12,0.8,0.12,1);background:conic-gradient(#dc2626 0 45deg,#2563eb 45deg 90deg,#16a34a 90deg 135deg,#eab308 135deg 180deg,#9333ea 180deg 225deg,#ea580c 225deg 270deg,#0891b2 270deg 315deg,#db2777 315deg 360deg)}
#ruleta span{position:absolute;left:50%;top:50%;font-weight:bold;color:white;font-size:13px;transform-origin:0 0}
#flecha{font-size:40px;margin-bottom:-10px}
button{background:#dc2626;color:white;border:none;padding:15px 30px;font-size:19px;border-radius:12px}
#resultado{font-size:28px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<h1>🏆 RULETA LIGUILLA MX</h1>
<p>8 equipos - 8 personas - 1 oportunidad</p>
<div class="card">
<h2 id="saludo">Hola</h2>
<div id="flecha">⬇️</div>
<div id="ruleta"></div>
<p>Presiona GIRAR y espera a que pare</p>
<button id="btn" onclick="girar()">🎡 GIRAR</button>
<div id="resultado"></div>
<p id="mensaje"></p>
</div>
<script>
const equipos=["Toluca","América","Cruz Azul","Tigres UANL","Monterrey","Chivas","Pachuca","León"];
const asignacion={1:0,2:4,3:1,4:6,5:2,6:7,7:3,8:5};
const params=new URLSearchParams(window.location.search);
const jugador=params.get('jugador')||"1";
document.getElementById('saludo').innerText="Hola, Jugador "+jugador;
const ruleta=document.getElementById('ruleta');
equipos.forEach((e,i)=>{
let s=document.createElement('span');
s.innerText=e;
s.style.transform=`rotate(${i*45+22}deg) translate(58px,-7px)`;
ruleta.appendChild(s);
});
let yaGiro=false;
function girar(){
if(yaGiro) return;
yaGiro=true;
document.getElementById('btn').innerText="Girando...";
let idx=asignacion[jugador]||0;
let vueltas=360*10;
let destino=360 - (idx*45+22);
let total=vueltas+destino;
ruleta.style.transform=`rotate(${total}deg)`;
setTimeout(()=>{
document.getElementById('resultado').innerText="🎉 ¡Tu equipo es: "+equipos[idx]+"!";
document.getElementById('mensaje').innerText="Este es tu equipo para la Liguilla. ¡Suerte, a ver quién es campeón!";
document.getElementById('btn').innerText="Ya giraste";
},6100);
}
</script>
</body>
</html>
